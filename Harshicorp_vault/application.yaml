apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: vault
  namespace: argocd
spec:
  project: default
  destination:
    namespace: vault
    server: https://kubernetes.default.svc
  source:
    repoURL: https://REPLACE-ME-WITH-YOUR-GIT-REPO
    targetRevision: HEAD
    path: Harshicorp_vault
    helm:
      releaseName: vault
      valueFiles:
        - values.yaml
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
