namespace: gitea

ingress:
  enabled: true
  className: nginx
  annotations: {}
  hosts:
    - host: git.pi2security.com
      paths:
        - path: /
          pathType: Prefix
  tls:
    - secretName: git-pi2security-com-tls
      hosts:
        - git.pi2security.com

persistence:
  size: 20Gi

valkey-cluster:
  enabled: false

valkey:
  enabled: true
  architecture: standalone
  global:
    valkey:
      password: CHANGEME_VALKEY_PASSWORD

postgresql-ha:
  enabled: false

postgresql:
  enabled: true
  global:
    postgresql:
      auth:
        username: gitea
        database: gitea
        password: CHANGEME_DB_PASSWORD
        postgresPassword: CHANGEME_DB_ADMIN_PASSWORD

  primary:
    persistence:
      size: 20Gi


gitea:
  admin:
    username: gitea-admin
    email: admin@git.pi2security.com
    existingSecret: gitea-admin-secret
  config:
    server:
      DOMAIN: git.pi2security.com
      ROOT_URL: https://git.pi2security.com/
      SSH_DOMAIN: git.pi2security.com
      PROTOCOL: http
      HTTP_PORT: 3000
    database:
      DB_TYPE: postgres
