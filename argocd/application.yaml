apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: gitea
  namespace: argocd
spec:
  project: default
  destination:
    namespace: gitea
    server: https://kubernetes.default.svc
  source:
    repoURL: https://REPLACE-ME-WITH-YOUR-GIT-REPO
    targetRevision: HEAD
    path: gitea
    helm:
      releaseName: gitea
      valueFiles:
        - ../argocd/values-gitea.yaml
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
